name: Prod
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches:
      - main
env:
  REPOSITORY: ${{ github.event.repository.name }}
  IMAGE_TAG: ${{ github.run_number }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
  AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY_PROD}}
  AWS_EKS_CLUSTER: ${{ secrets.AWS_EKS_CLUSTER_PROD }}
  REPLICA_NUMBER: 3
  AWS_REGION: eu-west-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install kubectl
      uses: azure/setup-kubectl@v2.0
      with:
        version: 'v1.24.0' # default is latest stable
      id: install

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{env.AWS_REGION}}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
      
    - name: Confirm registory is available
      uses: int128/create-ecr-repository-action@v1
      with:
        repository: ${{ env.REPOSITORY }}
        public: false

    - name: Build, tag, and push docker image to Amazon ECR
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
        docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
    
    - name: Tagging
      run: |
            echo "imageTag=${{ env.IMAGE_TAG}}" >> $GITHUB_ENV
            echo "projectName=${{ env.REPOSITORY}}" >> $GITHUB_ENV
            echo "registry=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
            echo "replicaNumber=${{env.REPLICA_NUMBER}}" >> $GITHUB_ENV

    - name: Render k8s manifests
      run: envsubst < deployments/deployment.template.yaml > deployments/deployment.yaml 

    - name: Commit and Push Changes to Infra Repo
      run: |
          git clone https://majorops:${{ secrets.REPO_TOKEN }}@github.com/Payinvert/infra.git
          cp -r deployments/deployment.yaml infra/${{ env.REPOSITORY }}
          cd infra && ls
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git add ${{ env.REPOSITORY }}/deployment.yaml
          git commit -m "Update deployment image to $IMAGE_TAG [skip ci]" || echo "No changes to commit"
          git push origin main
