name: Build and deploy service
on:
  push:
    branches: [ "dev" ]

env:
  REPOSITORY: ${{ github.event.repository.name }}
  IMAGE_TAG: ${{ github.run_number }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
  AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY_DEV}}
  AWS_EKS_CLUSTER: ${{ secrets.AWS_EKS_CLUSTER }}
  REPLICA_NUMBER: 1
  AWS_REGION: ${{ secrets.AWS_EKS_REGION }}

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # We do not recommend to use this in a pull request. Prefer using pull request
      # decoration instead.
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    # needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
                                                                                                                                             
    - name: Install kubectl
      uses: azure/setup-kubectl@v2.0
      with:
        version: 'v1.24.0' # default is latest stable
      id: install

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{env.AWS_REGION}}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
      
    - name: Confirm registory is available
      uses: int128/create-ecr-repository-action@v1
      with:
        repository: ${{ env.REPOSITORY }}
        public: false

    - name: Build, tag, and push docker image to Amazon ECR
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        echo "${{ secrets.DEV_ENV}}" >> .env
        docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
        docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

    - name: Update kube config
      run: aws eks update-kubeconfig --name ${{ env.AWS_EKS_CLUSTER }}
    
    - name: Tagging
      run: |
            echo "imageTag=${{ env.IMAGE_TAG}}" >> $GITHUB_ENV
            echo "projectName=${{ env.REPOSITORY}}" >> $GITHUB_ENV
            echo "registry=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
            echo "replicaNumber=${{env.REPLICA_NUMBER}}" >> $GITHUB_ENV
            
    - name: Render k8s manifests
      run: envsubst < deployments/dev-deployment.template.yaml > deployments/deployment.yaml 
      
    - name: Deploy to EKS
      run: |
        kubectl apply -f ./deployments/deployment.yaml
